# Few-shot recipe batch (user, 2026-10-12: "we want better performance"): variants of MM + anchored LoRA,
# each changing ONE thing from the cosyne-2026 recipe (rank 64, adapters 2e-4, head 5e-4, 2000 steps, stock dlc
# augmentation), on the same trunks, frames and draws as cosyne-2026, so every cell pairs with its baseline cell
# there. Why: anchored LoRA's val loss was still falling at step 2000 in 73 % of the cosyne-2026 cells, and the
# rank / lr were tuned on 2000 IBL frames, never at N = 10-25.

name: cosyne-2026-recipe
out_subdir: adaptation
keep_checkpoints: false
eval_last: true

n_frames: [10, 25]
draws: [0, 1, 2]
steps: {few: 2000, all: 6000}
val_every: 250

arms:
  aLoRA-4k:   {init: trunk, adapter: lora, rank: 64, lora_lr: 2.0e-4, head_lr: 5.0e-4, anchor: true,
               anchor_weight: 1.0, anchor_conf_power: 1, steps: {few: 4000}}               # train longer
  aLoRA-hilr: {init: trunk, adapter: lora, rank: 64, lora_lr: 5.0e-4, head_lr: 1.0e-3, anchor: true,
               anchor_weight: 1.0, anchor_conf_power: 1}                                     # 2.5x / 2x lr
  aLoRA-r16:  {init: trunk, adapter: lora, rank: 16, lora_lr: 2.0e-4, head_lr: 5.0e-4, anchor: true,
               anchor_weight: 1.0, anchor_conf_power: 1}                                     # paper rank
  aLoRA-zoom: {init: trunk, adapter: lora, rank: 64, lora_lr: 2.0e-4, head_lr: 5.0e-4, anchor: true,
               anchor_weight: 1.0, anchor_conf_power: 1, config: configs/model_zoominout.yaml}  # recipe aug
curve_arms: [aLoRA-4k, aLoRA-hilr, aLoRA-r16, aLoRA-zoom]

datasets:   # same leave-one-out trunks as cosyne-2026: two labs with a big gap to dedicated, two noisy ones
  ibl:       {trunk: experiments/E6c-LOO-ibl-headmlp256/face+cheese+caz+kondo+hmv+c3d+kauf_train/supervised/sampling-T2/tf1/vits_dinov3/seed0}
  kaufman:   {trunk: experiments/E6a-LOO-kaufman-headmlp256/face+ibl+cheese+caz+kondo+hmv+c3d_train/supervised/sampling-T2/tf1/vits_dinov3/seed0}
  cheese-2d: {trunk: experiments/E13-LOO-cheese-headmlp256/face+ibl+caz+kondo+hmv+kauf_train/supervised/sampling-T2/tf1/vits_dinov3/seed0}
  kondo:     {trunk: experiments/E10-LOO-kondo-headmlp256/face+ibl+cheese+caz+hmv+c3d+kauf_train/supervised/sampling-T2/tf1/vits_dinov3/seed0}

dedicated:
  linear:    dedicated/{ds}_train/supervised/sampling-T2/tf1/vits_dinov3/seed0
  nonlinear: dedicated-headmlp256/{ds}_train/supervised/sampling-T2/tf1/vits_dinov3/seed0
