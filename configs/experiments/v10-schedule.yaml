# Backbone-unfreezing / learning-rate-schedule experiments for zero-shot transfer (corpus head-fixed-v10,
# started 2026-10-22 on NCSA Delta). Read by scripts/delta/exp_specs.py, which prints one run per
# (experiment, target, seed) that has not started yet, for scripts/delta/interactive_feeder.sh --specs.
#
# BASELINE (do not change): recipe of record S with the shared nonlinear head, i.e. exactly
#   scripts/train_plan.sh submit loo:<ds> --arch S          (seed 0)
# = configs/model_zoominout.yaml (ViT-S DINOv3, 12k steps, bs 32, Adam 5e-5, unfreezing_step 1000,
#   MultiStepLR milestones [4000, 6000, 8000] x 0.5, T=2, per-dataset zoom) + head_overrides below,
#   results in <results_dir>/trunks-headmlp256/. Its leave-ibl-out and leave-kaufman-out runs exist.
# Every experiment = the baseline command + its `overrides` (Hydra), results in
#   <results_dir>/experiments/<id>/<tag>_train/supervised/sampling-T2/tf1/vits_dinov3/seed<k>/
# Experiments with `area: baseline` are baseline-recipe runs (new target or seed) and go to
# trunks-headmlp256/ with the rest of the baseline.
#
# Note on the baseline schedule: lightning-pose's UnfreezeBackbone ramps the backbone LR from 0.1x the
# head LR by x1.5 per STEP in step mode, i.e. the backbone reaches the full LR ~6 steps after unfreezing.

config: configs/model_zoominout.yaml
backbone: vits_dinov3
head_overrides: ["+model.head_hidden_channels=256", "+training.ckpt_every_n_steps=2000"]

targets:                               # leave-out set per target; the trunk trains on all other datasets
  ibl: [ibl]
  cheese: [cheese-2d, cheese-3d]       # same rig and mice: leave both out for a clean zero-shot number
  kaufman: [kaufman]

experiments:
  B:                                   # baseline recipe, seed 0 (only leave-both-cheese-out is new)
    area: baseline
    seeds: [0]
    overrides: []
  B-seed1:                             # baseline recipe, seed 1: how much zero-shot moves with the seed alone
    area: baseline
    seeds: [1]
    overrides: []
  E1-unfreeze3000:                     # longer head-only phase (linear-probe-then-finetune style)
    seeds: [0]
    overrides: ["training.unfreezing_step=3000"]
  E2-lr-late:                          # keep the LR high longer: halve at 8k / 10k / 11k instead of 4k / 6k / 8k
    seeds: [0]
    overrides: ["training.lr_scheduler_params.multisteplr.milestone_steps=[8000,10000,11000]"]
  E3-unfreeze3000-lr-late:             # both
    seeds: [0]
    overrides: ["training.unfreezing_step=3000",
                "training.lr_scheduler_params.multisteplr.milestone_steps=[8000,10000,11000]"]
