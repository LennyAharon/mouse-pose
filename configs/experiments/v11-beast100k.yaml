# Our experiment (user, 2026-11-03; not the recipe of record, not for upstream): the BEAST leave-out test (v11-beast.yaml)
# with three new BEAST 2.0 ViT-B/16 checkpoints in place of the IBL one: MAE (InfoNCE off), 224 px, ~280k steps on 100k-frame
# pretraining sets "100k_methodA1", "100k_methodA2", "100k_methodB" (MW, /media/mattw/poseinterface/videos/pretrain_datasets/;
# copies in /work/nvme/beez/laharon/Beast_ckp). Encoders converted with poseinterface/pretrained/vitb16-beast-ibl/convert_beast.py
# (transformers-5 key names; 198/198 tensors load) into poseinterface/pretrained/beast-100k-method{A1,A2,B}/encoder.safetensors.
# Subset (user): the three both-out trunks + ibl, 4 per backbone. Recipe E5 at 384 px as BEAST-E5 / DINOv3B-E5 / R384-E5;
# methodA1 also at 256 px (user: "at least A1 in 256x256 besides the 384"; compare with the v11 E5 trunks at 256).
# The pretraining videos may include sessions of the left-out datasets: leave-out is then not image-blind (as BEAST on ibl).
# Run folders say vitb_imagenet (the architecture); the experiment folder says which weights.
# Results: <results_dir>/experiments/BEAST100k{A1,A2,B}-E5/ and BEAST100kA1-E5-256/.

config: configs/model_zoominout.yaml
backbone: vitb_imagenet
head_overrides: ["+model.head_hidden_channels=256",
                 "+training.resume_every_n_steps=500"]   # rolling checkpoint: runs continue across jobs

targets:
  ibl: [ibl]
  cheese: [cheese-2d, cheese-3d]       # both-out: clean zero-shot for same-rig / same-lab pairs
  kaufman-both: [kaufman, kaufman-water]
  hantman-both: [hantman-mv, tyssowski]

experiments:
  BEAST100kA1-E5:
    seeds: [0]
    overrides: ["+model.backbone_checkpoint=/work/nvme/beez/laharon/MM_project/poseinterface/pretrained/beast-100k-methodA1/encoder.safetensors",
                "training.unfreezing_step=3000", "training.min_steps=14000", "training.max_steps=14000",
                "training.lr_scheduler_params.multisteplr.milestone_steps=[6000,8000,10000]",
                "data.image_resize_dims.height=384", "data.image_resize_dims.width=384"]
  BEAST100kA2-E5:
    seeds: [0]
    overrides: ["+model.backbone_checkpoint=/work/nvme/beez/laharon/MM_project/poseinterface/pretrained/beast-100k-methodA2/encoder.safetensors",
                "training.unfreezing_step=3000", "training.min_steps=14000", "training.max_steps=14000",
                "training.lr_scheduler_params.multisteplr.milestone_steps=[6000,8000,10000]",
                "data.image_resize_dims.height=384", "data.image_resize_dims.width=384"]
  BEAST100kB-E5:
    seeds: [0]
    overrides: ["+model.backbone_checkpoint=/work/nvme/beez/laharon/MM_project/poseinterface/pretrained/beast-100k-methodB/encoder.safetensors",
                "training.unfreezing_step=3000", "training.min_steps=14000", "training.max_steps=14000",
                "training.lr_scheduler_params.multisteplr.milestone_steps=[6000,8000,10000]",
                "data.image_resize_dims.height=384", "data.image_resize_dims.width=384"]
  BEAST100kA1-E5-256:
    seeds: [0]
    overrides: ["+model.backbone_checkpoint=/work/nvme/beez/laharon/MM_project/poseinterface/pretrained/beast-100k-methodA1/encoder.safetensors",
                "training.unfreezing_step=3000", "training.min_steps=14000", "training.max_steps=14000",
                "training.lr_scheduler_params.multisteplr.milestone_steps=[6000,8000,10000]",
                "data.image_resize_dims.height=256", "data.image_resize_dims.width=256"]
