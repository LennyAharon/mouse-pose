# Zero-shot vs number of training datasets (user, 2026-10-26), written by
# scripts/scaling_subsets.py (do not edit by hand). Per target: the other datasets minus the
# target's sibling, shuffled once per draw; the first 3 / 6 / 9 are nested random subsets; 3 draws.
# The top point of each curve is the leave-one-out trunk (experiments/R384-E5; both-out for a
# target with a sibling). Same recipe as those trunks: E5 at 384 px, nonlinear head, seed 0.
# Runs: <results_dir>/experiments/SCALE/<tag>_train/; checkpoints deleted after evaluation.
# Draw seeds per target ([seed, target index]): {'hantman-mv': [0, 1, 2]}.

config: configs/model_zoominout.yaml
backbone: vits_dinov3
drop_checkpoints: true
head_overrides:
- +model.head_hidden_channels=256
- +training.resume_every_n_steps=500
- training.unfreezing_step=3000
- training.min_steps=14000
- training.max_steps=14000
- training.lr_scheduler_params.multisteplr.milestone_steps=[6000,8000,10000]
- data.image_resize_dims.height=384
- data.image_resize_dims.width=384
targets:
  hantman-mv-k3-d0:
    keep:
    - ibl
    - kaufman
    - aind-vbn-body
    zeroshot:
    - hantman-mv
  hantman-mv-k6-d0:
    keep:
    - ibl
    - kondo
    - cheese-3d
    - kaufman
    - aind-vbn-body
    - aind-vbn-face
    zeroshot:
    - hantman-mv
  hantman-mv-k9-d0:
    keep:
    - facemap
    - ibl
    - cazettes-side
    - kondo
    - cheese-3d
    - kaufman
    - aind-vbn-body
    - aind-vbn-face
    - kaufman-water
    zeroshot:
    - hantman-mv
  hantman-mv-k3-d1:
    keep:
    - ibl
    - cheese-2d
    - cavelli
    zeroshot:
    - hantman-mv
  hantman-mv-k6-d1:
    keep:
    - facemap
    - ibl
    - cheese-2d
    - cheese-3d
    - aind-vbn-face
    - cavelli
    zeroshot:
    - hantman-mv
  hantman-mv-k9-d1:
    keep:
    - facemap
    - ibl
    - cheese-2d
    - kondo
    - cheese-3d
    - aind-vbn-body
    - aind-vbn-face
    - cavelli
    - kaufman-water
    zeroshot:
    - hantman-mv
  hantman-mv-k3-d2:
    keep:
    - cazettes-side
    - kondo
    - aind-vbn-body
    zeroshot:
    - hantman-mv
  hantman-mv-k6-d2:
    keep:
    - ibl
    - cazettes-side
    - kondo
    - kaufman
    - aind-vbn-body
    - kaufman-water
    zeroshot:
    - hantman-mv
  hantman-mv-k9-d2:
    keep:
    - ibl
    - cheese-2d
    - cazettes-side
    - kondo
    - kaufman
    - aind-vbn-body
    - aind-vbn-face
    - cavelli
    - kaufman-water
    zeroshot:
    - hantman-mv
experiments:
  SCALE:
    seeds:
    - 0
    overrides: []
