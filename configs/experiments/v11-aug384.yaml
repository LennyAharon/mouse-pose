# Stronger augmentation for zero-shot transfer to unseen views / scales (corpus head-fixed-v11, user 2026-10-26).
# Baseline = the v11 trunks of record: recipe E5 at 384 x 384 (configs/experiments/v11-res384.yaml, results in
# <results_dir>/experiments/R384-E5/). Every arm = that baseline + ONE augmentation change (steps / schedule unchanged:
# the user does not want to touch the steps yet); AUG-ALL combines all four. Targets: the all-data trunk (in-domain
# cost) and four zero-shot problems: kondo (bottom view), facemap (close-up scale), both cheese labs and both kaufman
# labs (clean leave-outs). R384-E5 seed 1 = the seed-noise reference for the same five trunks.
#
# The recipe's imgaug block (configs/model_zoominout.yaml) already has Rotate +-25 deg (p 0.4), MotionBlur, CoarseDropout,
# CoarseSalt / Pepper, ElasticTransformation, per-dataset CropAndPad zoom and hflip with left/right swap. New augmenters
# are any imgaug.augmenters class by name (lightning_pose/data/augmentations.py imgaug_transform), applied in this
# order after the existing ones; geometric ones move the keypoints, out-of-frame keypoints become unlabeled.

config: configs/model_zoominout.yaml
backbone: vits_dinov3
head_overrides: ["+model.head_hidden_channels=256",
                 "+training.resume_every_n_steps=500",   # rolling checkpoint: runs continue across jobs
                 # recipe E5 at 384 px (= R384-E5)
                 "training.unfreezing_step=3000", "training.min_steps=14000", "training.max_steps=14000",
                 "training.lr_scheduler_params.multisteplr.milestone_steps=[6000,8000,10000]",
                 "data.image_resize_dims.height=384", "data.image_resize_dims.width=384"]

targets:
  all: []
  kondo: [kondo]
  facemap: [facemap]
  cheese: [cheese-2d, cheese-3d]
  kaufman-both: [kaufman, kaufman-water]

experiments:
  R384-E5:                              # baseline, seed 1 (seed 0 exists): noise reference
    seeds: [1]
    overrides: []
  AUG-ZOOM:                             # close-ups for every lab: zoom in up to 2.5x around a shifted centre
    seeds: [0]
    overrides: ["+training.imgaug.Affine.p=0.4", "+training.imgaug.Affine.kwargs.scale=[1.0,2.5]",
                "+training.imgaug.Affine.kwargs.translate_percent=[-0.25,0.25]"]
  AUG-ROT:                              # any head orientation: full in-plane rotation instead of +-25 deg
    seeds: [0]
    overrides: ["training.imgaug.Rotate.p=0.6", "training.imgaug.Rotate.kwargs.rotate=[-180,180]"]
  AUG-PERSP:                            # camera tilt: perspective warp + shear
    seeds: [0]
    overrides: ["+training.imgaug.PerspectiveTransform.p=0.5", "+training.imgaug.PerspectiveTransform.kwargs.scale=[0.02,0.12]",
                "+training.imgaug.ShearX.p=0.3", "+training.imgaug.ShearX.kwargs.shear=[-15,15]",
                "+training.imgaug.ShearY.p=0.3", "+training.imgaug.ShearY.kwargs.shear=[-15,15]"]
  AUG-APPEAR:                           # lighting / camera differences
    seeds: [0]
    overrides: ["+training.imgaug.GammaContrast.p=0.3", "+training.imgaug.GammaContrast.kwargs.gamma=[0.5,2.0]",
                "+training.imgaug.LinearContrast.p=0.3", "+training.imgaug.LinearContrast.kwargs.alpha=[0.6,1.6]",
                "+training.imgaug.GaussianBlur.p=0.2", "+training.imgaug.GaussianBlur.kwargs.sigma=[0.0,2.0]",
                "+training.imgaug.JpegCompression.p=0.2", "+training.imgaug.JpegCompression.kwargs.compression=[50,95]",
                "+training.imgaug.AdditiveGaussianNoise.p=0.2", "+training.imgaug.AdditiveGaussianNoise.kwargs.scale=[0,12]"]
  AUG-ALL:                              # all four together
    seeds: [0]
    overrides: ["+training.imgaug.Affine.p=0.4", "+training.imgaug.Affine.kwargs.scale=[1.0,2.5]",
                "+training.imgaug.Affine.kwargs.translate_percent=[-0.25,0.25]",
                "training.imgaug.Rotate.p=0.6", "training.imgaug.Rotate.kwargs.rotate=[-180,180]",
                "+training.imgaug.PerspectiveTransform.p=0.5", "+training.imgaug.PerspectiveTransform.kwargs.scale=[0.02,0.12]",
                "+training.imgaug.ShearX.p=0.3", "+training.imgaug.ShearX.kwargs.shear=[-15,15]",
                "+training.imgaug.ShearY.p=0.3", "+training.imgaug.ShearY.kwargs.shear=[-15,15]",
                "+training.imgaug.GammaContrast.p=0.3", "+training.imgaug.GammaContrast.kwargs.gamma=[0.5,2.0]",
                "+training.imgaug.LinearContrast.p=0.3", "+training.imgaug.LinearContrast.kwargs.alpha=[0.6,1.6]",
                "+training.imgaug.GaussianBlur.p=0.2", "+training.imgaug.GaussianBlur.kwargs.sigma=[0.0,2.0]",
                "+training.imgaug.JpegCompression.p=0.2", "+training.imgaug.JpegCompression.kwargs.compression=[50,95]",
                "+training.imgaug.AdditiveGaussianNoise.p=0.2", "+training.imgaug.AdditiveGaussianNoise.kwargs.scale=[0,12]"]
